    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .gradient-bg-animated {
        background: linear-gradient(-45deg, #0c4a6e, #1e1b4b, #4c1d95, #164e63);
        background-size: 400% 400%;
        animation: gradient-animation 20s ease infinite;
      }
      @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .gradient-text {
        background: linear-gradient(90deg, #0EA5E9, #2DD4BF, #818CF8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: gradient-text-animation 5s linear infinite;
      }
       @keyframes gradient-text-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .glow-on-hover:hover {
        filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.5));
      }
    </style>
